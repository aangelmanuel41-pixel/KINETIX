name: Compilar aplicaciones KINETIX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'requirements.txt'
      - 'build_app.spec'
      - '.github/workflows/compilar-apps.yml'

permissions:
  contents: read

jobs:
  compilar:
    name: KINETIX en ${{ matrix.sistema }}
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sistema: [windows-latest, macos-15]

    steps:
      - name: Obtener KINETIX
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Descargar modelo de deteccion de mano
        shell: python
        run: |
          from pathlib import Path
          import requests
          url = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
          response = requests.get(url, timeout=90)
          response.raise_for_status()
          Path("hand_landmarker.task").write_bytes(response.content)
          assert Path("hand_landmarker.task").stat().st_size > 100_000

      - name: Compilar KINETIX
        run: python -m PyInstaller --noconfirm --clean build_app.spec

      - name: Crear ZIP para Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/KINETIX.exe -DestinationPath KINETIX-Windows.zip

      - name: Crear ZIP para macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/KINETIX.app KINETIX-macOS.zip

      - name: Publicar aplicacion descargable
        uses: actions/upload-artifact@v4
        with:
          name: KINETIX-${{ matrix.sistema }}
          path: KINETIX-*.zip
          if-no-files-found: error
          retention-days: 30
