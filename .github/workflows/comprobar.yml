name: Comprobacion basica KINETIX

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sintaxis-y-repositorio:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile main.py
      - run: python tests/check_repository.py
